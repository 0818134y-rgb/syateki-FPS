<style>
  :root { --acc:#ffb347; --bg:rgba(10,12,28,.9); }

  canvas#c { display:block; position:fixed; inset:0; }

  #dmgdir { position:fixed; left:50%; top:50%; width:0; height:0; z-index:6; pointer-events:none; opacity:0; }

  #score table { width:100%; border-collapse:collapse; font-size:15px; } #score td, #score th { padding:3px 8px; text-align:left; } #score th { color:var(--acc); }
  #net { right:14px; bottom:96px; font-size:12px; opacity:.85; text-align:right; }

  #panel { width:min(900px,96vw); height:min(640px,92vh); background:var(--bg); border:2px solid var(--acc); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  #panel header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid #fff3; }

  .row select, .row button, textarea, input[type=text], input[type=password] { background:#1b2040; color:#fff; border:1px solid #fff4; border-radius:6px; padding:5px 10px; font-size:13px; }

  footer { padding:10px 16px; border-top:1px solid #fff3; display:flex; gap:10px; align-items:center; } footer .hint { flex:1; margin:0; }

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
/* ======= 共有ロジック(サーバー/クライアント共通: マップ・移動・武器・当たり判定) ======= */
const G = (() => {
// =====================================================================
// shared/game.js  —  サーバーとクライアントで「完全に同じ」計算をするための共有モジュール
//   ・マップ生成(壁・遮蔽物・スポーン)  ・プレイヤー移動(予測と権威で共用)
//   ・武器データ/散布度  ・乱数(同じseedなら同じ弾道)  ・レイ判定(壁/箱)
// 単位: 距離=メートル, 時間=秒, 角度=ラジアン。ブラウザ/Node.js どちらでも動く(依存なし)。
// =====================================================================

const GW = 40, GH = 30, CELL = 3;
const TICK = 64, DT = 1 / TICK;

const CFG = {
  move: { runSpeed: 6.2, walkSpeed: 3.0, crouchSpeed: 3.0, accel: 55, decel: 70, airAccel: 6, jumpSpeed: 6.2, gravity: 20,
          radius: 0.38, height: 1.8, crouchHeight: 1.25, eye: 1.62, crouchEye: 1.12, step: 0.15 },
  stopThreshold: 1.0, footstepStride: 2.3,
};

/** 武器。sp = 散布(円錐の半角rad): stand=静止 / move=最大移動 / air=空中 / crouch=しゃがみ倍率 / bloom=連射の蓄積 */
const WEAPONS = {
  pistol:   { id: 'pistol',   name: 'コルクピストル', auto: false, interval: 0.17,  mag: 13, reload: 1.5, pellets: 1,  dmg: { h: 78, b: 26, l: 22 },
              sp: { stand: 0.0, move: 0.045, air: 0.09, crouch: 0.7, bloom: 0.014, bloomMax: 0.035, rec: 0.10 }, kick: 0.010, kickYaw: 0.004, speed: 1.0,  col: 0xc4281c },
  smg:      { id: 'smg',      name: 'ひまわりSMG',    auto: true,  interval: 0.075, mag: 30, reload: 2.2, pellets: 1,  dmg: { h: 78, b: 26, l: 22 },
              sp: { stand: 0.006, move: 0.05, air: 0.09, crouch: 0.7, bloom: 0.007, bloomMax: 0.04, rec: 0.09 }, kick: 0.0075, kickYaw: 0.005, speed: 0.96, col: 0xe6b422 },
  shotgun:  { id: 'shotgun',  name: '花火筒',         auto: false, interval: 0.85,  mag: 5,  reload: 2.4, pellets: 10, dmg: { h: 20, b: 11, l: 8 },
              sp: { stand: 0.045, move: 0.06, air: 0.08, crouch: 0.8, bloom: 0, bloomMax: 0, rec: 1 }, kick: 0.04, kickYaw: 0.01, speed: 0.95, col: 0x8a5a2b, falloff: [7, 22] },
  marksman: { id: 'marksman', name: '狛犬',           auto: true,  interval: 0.12,  mag: 24, reload: 2.6, pellets: 1,  dmg: { h: 115, b: 35, l: 29 },
              sp: { stand: 0.004, move: 0.05, air: 0.09, crouch: 0.7, bloom: 0.01, bloomMax: 0.04, rec: 0.10 }, kick: 0.011, kickYaw: 0.004, speed: 0.95, col: 0x2f8f4e, zoom: 1.5 },
  rifle:    { id: 'rifle',    name: '八咫(ヤタ)',     auto: true,  interval: 0.10,  mag: 25, reload: 2.5, pellets: 1,  dmg: { h: 160, b: 40, l: 34 },
              sp: { stand: 0.0, move: 0.065, air: 0.10, crouch: 0.6, bloom: 0.008, bloomMax: 0.05, rec: 0.10 }, kick: 0.014, kickYaw: 0.006, speed: 0.95, col: 0x7a1d18 },
  sniper:   { id: 'sniper',   name: '大玉砲',         auto: false, interval: 1.5,   mag: 5,  reload: 3.6, pellets: 1,  dmg: { h: 255, b: 150, l: 120 },
              sp: { stand: 0.09, move: 0.12, air: 0.15, crouch: 0.8, bloom: 0, bloomMax: 0, rec: 1, scopedMove: 0.03 }, kick: 0.035, kickYaw: 0, speed: 0.88, col: 0x23232e, scope: [2.5, 5] },
};
const WEAPON_ORDER = ['pistol', 'smg', 'shotgun', 'marksman', 'rifle', 'sniper'];

/** seed付き乱数(mulberry32): 同じseedならサーバーとクライアントで同じ弾道になる */
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/** 散布度 = 基本 + 移動/空中ペナルティ。ストッピングの正体(クライアントの予測とサーバーの検証で同じ式) */
function computeSpread(w, speed, grounded, crouch, scoped) {
  const sp = w.sp; const base = scoped ? 0 : sp.stand * (crouch ? sp.crouch : 1); let add = 0;
  if (!grounded) add = sp.air;
  else if (speed > CFG.stopThreshold) {
    const t = clamp((speed - CFG.stopThreshold) / (CFG.move.runSpeed - CFG.stopThreshold), 0, 1);
    add = (scoped && sp.scopedMove != null ? sp.scopedMove : sp.move) * (0.35 + 0.65 * t);
  }
  return { base, add };
}
/** 視線ベクトル(fwd)・右(right)・上(up) */
function aimBasis(yaw, pitch) {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
  return { fwd: [-sy * cp, sp, -cy * cp], right: [cy, 0, -sy], up: [sy * sp, cp, cy * sp] };
}
/** 散布円錐の中で一様に1本の弾道を選ぶ(sqrtで円内を一様分布に) */
function spreadDir(b, spread, rng) {
  const ang = rng() * Math.PI * 2, rad = Math.tan(spread * Math.sqrt(rng())), c = Math.cos(ang) * rad, s = Math.sin(ang) * rad;
  const x = b.fwd[0] + b.right[0] * c + b.up[0] * s, y = b.fwd[1] + b.right[1] * c + b.up[1] * s, z = b.fwd[2] + b.right[2] * c + b.up[2] * s, l = Math.hypot(x, y, z);
  return [x / l, y / l, z / l];
}

// ---------------------------------------------------------------------
// マップ(矩形コマンドで生成)。1セル=3m。z小=防衛側(北)、z大=攻撃側(南)
//   # 壁  c 木箱  C 高い木箱  L 低い仕切り(跳び乗れる)  y 屋台  p 石灯籠
// ---------------------------------------------------------------------
const TYPES = { '#': { h: 5.5, inset: 0 }, c: { h: 1.4, inset: 0.25 }, C: { h: 2.6, inset: 0.2 }, L: { h: 0.9, inset: 0.2 }, y: { h: 3.2, inset: 0.1 } };
const SITES = { A: { cx: 5, cz: 5 }, B: { cx: 34, cz: 5 } };
const cellToWorld = (gx, gz) => ({ x: (gx + 0.5 - GW / 2) * CELL, z: (gz + 0.5 - GH / 2) * CELL });
const worldToCell = (x, z) => [clamp(Math.floor(x / CELL + GW / 2), 0, GW - 1), clamp(Math.floor(z / CELL + GH / 2), 0, GH - 1)];

function buildMap() {
  const grid = Array.from({ length: GH }, () => Array(GW).fill('.'));
  const rect = (ch, x0, z0, x1, z1) => { for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) grid[z][x] = ch; };
  const sym = (ch, x0, z0, x1, z1) => { rect(ch, x0, z0, x1, z1); rect(ch, GW - 1 - x1, z0, GW - 1 - x0, z1); };   // 左右対称
  rect('#', 0, 0, GW - 1, 0); rect('#', 0, GH - 1, GW - 1, GH - 1); rect('#', 0, 0, 0, GH - 1); rect('#', GW - 1, 0, GW - 1, GH - 1);
  sym('#', 12, 1, 15, 2); sym('#', 12, 6, 17, 9); sym('#', 7, 10, 9, 11); sym('#', 12, 10, 15, 11);
  sym('#', 7, 12, 7, 13); sym('#', 7, 16, 7, 17); sym('#', 14, 12, 15, 12); sym('#', 14, 15, 15, 17); sym('#', 7, 18, 7, 19); sym('#', 10, 18, 15, 19);
  sym('#', 1, 25, 12, 28);
  sym('C', 3, 3, 3, 4); sym('c', 6, 5, 7, 6); sym('L', 9, 3, 9, 4); sym('p', 10, 8, 10, 8); sym('L', 2, 8, 4, 8); sym('c', 8, 8, 8, 8); sym('c', 16, 1, 16, 1);
  sym('c', 2, 13, 3, 14); sym('L', 5, 17, 6, 17); sym('C', 2, 20, 2, 21); sym('c', 5, 22, 5, 22); sym('L', 4, 11, 4, 11);
  sym('L', 10, 15, 11, 15); sym('c', 12, 16, 13, 16);
  rect('y', 19, 14, 20, 15); sym('c', 16, 12, 16, 12); sym('L', 17, 17, 18, 17); sym('c', 17, 19, 17, 19); sym('p', 18, 11, 18, 11);
  sym('y', 8, 21, 10, 22); sym('y', 12, 23, 13, 24); rect('y', 19, 21, 20, 22);
  sym('c', 4, 24, 4, 24); sym('C', 14, 20, 14, 20); sym('c', 6, 24, 7, 24); sym('p', 11, 20, 11, 20); sym('p', 17, 24, 17, 24); sym('L', 16, 21, 16, 22);
  rect('.', 32, 5, 33, 6); rect('C', 32, 5, 32, 6); rect('c', 29, 7, 30, 7); rect('C', 33, 17, 34, 18); rect('c', 33, 22, 33, 22); rect('L', 30, 4, 30, 4);

  // 隣接する同種セルを大きな箱へ統合(判定・描画の数を減らす)
  const boxes = [], vis = Array.from({ length: GH }, () => Array(GW).fill(false)); let ci = 0;
  for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) {
    const ch = grid[z][x], T = TYPES[ch]; if (!T || vis[z][x]) continue;
    let x1 = x; while (x1 + 1 < GW && grid[z][x1 + 1] === ch && !vis[z][x1 + 1]) x1++;
    let z1 = z, ok = true;
    while (ok && z1 + 1 < GH) { for (let xx = x; xx <= x1; xx++) if (grid[z1 + 1][xx] !== ch || vis[z1 + 1][xx]) { ok = false; break; } if (ok) z1++; }
    for (let zz = z; zz <= z1; zz++) for (let xx = x; xx <= x1; xx++) vis[zz][xx] = true;
    boxes.push({ ch, ci: ci++, h: T.h, w: (x1 - x + 1) * CELL - T.inset * 2, d: (z1 - z + 1) * CELL - T.inset * 2, cx: ((x + x1 + 1) / 2 - GW / 2) * CELL, cz: ((z + z1 + 1) / 2 - GH / 2) * CELL });
  }
  for (let z = 0; z < GH; z++) for (let x = 0; x < GW; x++) if (grid[z][x] === 'p') { const p = cellToWorld(x, z); boxes.push({ ch: 'p', ci: ci++, h: 2.0, w: 0.9, d: 0.9, cx: p.x, cz: p.z }); }
  const colliders = boxes.map(b => ({ minX: b.cx - b.w / 2, maxX: b.cx + b.w / 2, minY: 0, maxY: b.h, minZ: b.cz - b.d / 2, maxZ: b.cz + b.d / 2 }));

  // スポーン地点(攻撃=南の広間 / 防衛=北のベース)
  const spawns = { atk: [], def: [] };
  for (let z = 27; z <= 28; z++) for (let x = 16; x <= 23; x++) spawns.atk.push(cellToWorld(x, z));
  for (let z = 1; z <= 3; z++) for (let x = 17; x <= 22; x++) spawns.def.push(cellToWorld(x, z));
  return { grid, boxes, colliders, spawns };
}

// ---------------------------------------------------------------------
// プレイヤー移動(サーバーとクライアントの予測で共用 = 入力が同じなら結果が同じ)
//   p   : {x,y,z,vx,vy,vz,grounded,crouch}
//   cmd : {ix,iz,jump,cr,walk,yaw}   ix=右+1 / iz=後ろ+1
// ---------------------------------------------------------------------
function resolveHorizontal(p, colliders, H) {
  const r = CFG.move.radius, S0 = CFG.move.step;
  for (let it = 0; it < 2; it++) for (const b of colliders) {
    if (p.y >= b.maxY - S0 || p.y + H <= b.minY) continue;
    const cx = clamp(p.x, b.minX, b.maxX), cz = clamp(p.z, b.minZ, b.maxZ), dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-10) {
      const d = Math.sqrt(d2), push = r - d, nx = dx / d, nz = dz / d; p.x += nx * push; p.z += nz * push;
      const vn = p.vx * nx + p.vz * nz; if (vn < 0) { p.vx -= vn * nx; p.vz -= vn * nz; }      // 壁に向かう速度だけ消す(壁ずり)
    } else {
      const l = p.x - b.minX, rr = b.maxX - p.x, t = p.z - b.minZ, bt = b.maxZ - p.z, mn = Math.min(l, rr, t, bt);
      if (mn === l) p.x = b.minX - r; else if (mn === rr) p.x = b.maxX + r; else if (mn === t) p.z = b.minZ - r; else p.z = b.maxZ + r;
    }
  }
  const lx = GW * CELL / 2 - 1, lz = GH * CELL / 2 - 1; p.x = clamp(p.x, -lx, lx); p.z = clamp(p.z, -lz, lz);
}
function resolveVertical(p, prevY, colliders, H) {
  const r = CFG.move.radius, S0 = CFG.move.step; p.grounded = false; let floor = 0;
  for (const b of colliders) if (p.x > b.minX - r * 0.7 && p.x < b.maxX + r * 0.7 && p.z > b.minZ - r * 0.7 && p.z < b.maxZ + r * 0.7) {
    if (p.vy <= 0 && prevY >= b.maxY - S0 && p.y <= b.maxY) floor = Math.max(floor, b.maxY);
    else if (p.vy > 0 && prevY + H <= b.minY + 0.02 && p.y + H > b.minY) { p.y = b.minY - H; p.vy = 0; }
  }
  if (p.y <= floor) { p.y = floor; p.vy = 0; p.grounded = true; }
}
function stepPlayer(p, cmd, dt, colliders, wspeed = 1) {
  const m = CFG.move; let ix = cmd.ix, iz = cmd.iz; const len = Math.hypot(ix, iz); if (len > 0) { ix /= len; iz /= len; }
  p.crouch = !!cmd.cr;
  const sy = Math.sin(cmd.yaw), cy = Math.cos(cmd.yaw), wishX = cy * ix + sy * iz, wishZ = -sy * ix + cy * iz;
  const maxSpeed = (p.crouch ? m.crouchSpeed : cmd.walk ? m.walkSpeed : m.runSpeed) * wspeed;
  const rate = p.grounded ? (len > 0 ? m.accel : m.decel) : (len > 0 ? m.airAccel : 0);
  let dx = wishX * maxSpeed - p.vx, dz = wishZ * maxSpeed - p.vz; const dl = Math.hypot(dx, dz), md = rate * dt;
  if (dl > md) { dx *= md / dl; dz *= md / dl; } p.vx += dx; p.vz += dz;
  if (cmd.jump && p.grounded) { p.vy = m.jumpSpeed; p.grounded = false; }
  p.vy -= m.gravity * dt;
  const H = p.crouch ? m.crouchHeight : m.height, prevY = p.y;
  p.x += p.vx * dt; p.z += p.vz * dt; resolveHorizontal(p, colliders, H);
  p.y += p.vy * dt; resolveVertical(p, prevY, colliders, H);
